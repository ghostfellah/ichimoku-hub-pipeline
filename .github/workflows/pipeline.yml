name: Ichimoku Hub Pipeline

on:
  schedule:
    # tous les jours à 9h00 UTC — 3h avant le run Notion de Claude (12h UTC),
    # pour laisser le temps aux transcriptions d'être prêtes.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ichimoku-hub-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decode YouTube cookies (si configurés)
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            echo "$YOUTUBE_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "Cookies YouTube chargés."
          else
            echo "Pas de secret YOUTUBE_COOKIES_B64 configuré, poursuite sans cookies."
          fi

      - name: Detect new videos (Étape 1)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_VIDEOS_DATA_SOURCE_ID: "75c495f5-81ac-4bd8-bd17-01b8047f0e93"
        run: python scripts/detect_new_videos.py

      - name: Extract transcripts
